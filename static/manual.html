<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Position Builder</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <meta name="theme-color" content="#FF5722">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #121212;
            color: #eee;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        input[type="number"], input[type="text"] {
            padding: 12px 15px;
            background: #1a1a1a;
            color: white;
            border: 1px solid #444;
            width: 100%;
            box-sizing: border-box;
            border-radius: 6px;
            font-size: 1em;
            transition: all 0.2s ease;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #2196F3;
            background: #222;
            box-shadow: 0 0 8px rgba(33, 150, 243, 0.3);
        }

        .row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .row>div {
            flex: 1;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 4px;
        }

        button:hover {
            background: #45a049;
        }

        pre.tab-box {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 5px;
            overflow-x: auto;
            color: #fff;
            font-size: 1.2em;
            border: 1px solid #444;
            line-height: 1.2;
            font-family: Consolas, "Courier New", Courier, monospace;
        }

        .coord-item {
            background: #222;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .danger-btn {
            background: #f44336;
            padding: 5px 10px;
            margin-top: 0;
        }

        .danger-btn:hover {
            background: #da190b;
        }
    </style>
</head>

<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;">
            <h1 style="margin: 0;">Manual Position Builder 🛠</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="location.href='/v2'" 
                    style="background: linear-gradient(135deg, #FF5722 0%, #D84315 100%); margin:0; padding:10px 16px; border:none; border-radius:6px; color:white; cursor:pointer; font-weight:bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">🎸 Visual Builder</button>
                <button onclick="newProject()" 
                    style="background: linear-gradient(135deg, #555 0%, #333 100%); margin:0; padding:10px 16px; border:none; border-radius:6px; color:white; cursor:pointer; font-weight:bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">➕ New Project</button>
                <button onclick="location.href='/'" 
                    style="background: linear-gradient(135deg, #2196F3 0%, #1565C0 100%); margin:0; padding:10px 16px; border:none; border-radius:6px; color:white; cursor:pointer; font-weight:bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">⬅ Back to Standard</button>
            </div>
        </div>

        <div class="row" style="margin-bottom: 20px;">
            <div>
                <label>Song Title:</label>
                <input type="text" id="songTitle" placeholder="My Awesome Riff" value="Untitled">
            </div>
        </div>

        <p>คุณสามารถระบุ **สาย (1-6)** และ **เฟรต (0-24)** โดยตรงเพื่อสร้างแบบเรียงลำดับตำแหน่งที่ต้องการได้!</p>

        <div class="row">
            <div>
                <label>String (1 = High E, 6 = Low E):</label>
                <input type="number" id="manualString" min="1" max="6" value="1">
            </div>
            <div>
                <label>Fret (0 = Open):</label>
                <input type="number" id="manualFret" min="0" max="24" value="0">
            </div>
        </div>
        <div class="row" style="align-items: center; margin-top: 15px;">
            <div style="flex: 0 0 auto;">
                <input type="checkbox" id="isSlide" style="width: 20px; height: 20px; cursor: pointer;">
            </div>
            <div>
                <label for="isSlide" style="cursor: pointer; font-size: 1em;"> 🔗 เป็นลูกสไลด์ (Slide
                    จากโน้ตก่อนหน้ามาที่นี่)</label>
            </div>
        </div>
        <button onclick="addPosition()">➕ Add Position</button>

        <h2>Sequence List:</h2>
        <p style="font-size: 0.9em; color: #aaa;">รายการการเล่นเรียงตามลำดับ (กดเพื่อลบออกได้)</p>
        <div id="position-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 20px;">
            <!-- Render items here -->
        </div>

        <button onclick="generateTab()"
            style="background: #FF5722; width: 100%; font-weight: bold; font-size: 1.1em;">Generate Visual Tab</button>

        <h2>Visual Tab:</h2>
        <button onclick="downloadTabTxt()" style="background: #4CAF50; margin: 0 0 10px 0;">📥 Download .txt</button>
        <pre class="tab-box" id="visual-tab">No items added yet...</pre>
    </div>

    <script>
        const TUNING_OPEN_MIDI = [
            64, // String 1 (e)
            59, // String 2 (B)
            55, // String 3 (G)
            50, // String 4 (D)
            45, // String 5 (A)
            40  // String 6 (E)
        ];
        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        let manualSequence = [];

        function getNoteName(string, fret) {
            const openMidi = TUNING_OPEN_MIDI[string - 1];
            const midi = openMidi + fret;
            const noteIndex = midi % 12;
            const octave = Math.floor(midi / 12) - 1;
            return NOTE_NAMES[noteIndex] + octave;
        }

        function addPosition() {
            const string = parseInt(document.getElementById('manualString').value);
            const fret = parseInt(document.getElementById('manualFret').value);
            const isSlide = document.getElementById('isSlide').checked;

            if (isNaN(string) || string < 1 || string > 6) { alert("Invalid string 1-6"); return; }
            if (isNaN(fret) || fret < 0 || fret > 24) { alert("Invalid fret 0-24"); return; }

            manualSequence.push({
                string: string,
                fret: fret,
                modifier: isSlide ? '/' : null
            });
            renderList();
            // Reset slide checkbox after adding
            document.getElementById('isSlide').checked = false;
        }

        function removePosition(index) {
            manualSequence.splice(index, 1);
            renderList();
        }

        function renderList() {
            const listDiv = document.getElementById('position-list');
            listDiv.innerHTML = '';

            if (manualSequence.length === 0) {
                listDiv.innerHTML = '<p style="color:#666; text-align:center;">Empty list</p>';
                return;
            }

            manualSequence.forEach((pos, idx) => {
                const noteName = getNoteName(pos.string, pos.fret);
                const slideText = pos.modifier === '/' ? ' <span style="color:#FF9800;">(Slide)</span>' : '';
                const item = document.createElement('div');
                item.className = 'coord-item';
                item.innerHTML = `
                    <span><b>[#${idx + 1}]</b> String: ${pos.string} | Fret: ${pos.fret} | <b>Note: ${noteName}</b>${slideText}</span>
                    <button class="danger-btn" onclick="removePosition(${idx})">Delete</button>
                `;
                listDiv.appendChild(item);
            });
        }

        async function generateTab() {
            if (manualSequence.length === 0) { alert("Please add positions to the list first!"); return; }

            // Convert to backend S<string>F<fret> format with slide support
            const notesPayload = manualSequence.map(p => {
                let code = `S${p.string}F${p.fret}`;
                return p.modifier === '/' ? `/${code}` : code;
            });

            const payload = {
                notes: notesPayload,
                min_fret: 0,
                max_fret: 24,
                allowed_strings: [1, 2, 3, 4, 5, 6]
            };

            try {
                const response = await fetch('/api/tab/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.tab_path) {
                    document.getElementById('visual-tab').innerText = drawASCII(data.tab_path);
                } else {
                    document.getElementById('visual-tab').innerText = "Error generating path.";
                }
            } catch (err) {
                document.getElementById('visual-tab').innerText = "Error: " + err;
            }
        }

        function drawASCII(tabData) {
            if (!tabData || tabData.length === 0) return "No path generated.";

            const strings = {
                1: "e|---", 2: "B|---", 3: "G|---", 4: "D|---", 5: "A|---", 6: "E|---"
            };

            tabData.forEach((pos, idx) => {
                let fretStr = pos.fret.toString();
                let isSlideNext = (idx + 1 < tabData.length && tabData[idx + 1].modifier === '/');

                for (let i = 1; i <= 6; i++) {
                    if (i === pos.string) {
                        if (pos.modifier === '/') {
                            strings[i] += "/" + fretStr;
                        } else {
                            strings[i] += "-" + fretStr;
                        }
                        if (!isSlideNext) strings[i] += "-";
                    } else {
                        let addedWidth = fretStr.length + 1;
                        strings[i] += "-".repeat(addedWidth);
                        if (!isSlideNext) strings[i] += "-";
                    }
                }
            });

            let out = [];
            for (let i = 1; i <= 6; i++) {
                out.push(strings[i] + "---|");
            }
            return out.join("\n");
        }

        function downloadTabTxt() {
            if (!manualSequence || manualSequence.length === 0) {
                alert("Please add positions and generate a tab first!");
                return;
            }

            const tabText = document.getElementById('visual-tab').innerText;
            if (tabText.startsWith("No") || tabText.startsWith("Error")) {
                alert("No completed tab to download!");
                return;
            }

            const songTitle = document.getElementById('songTitle').value || "Untitled";
            const filename = songTitle.replace(/[^a-z0-9]/gi, '_').toLowerCase() + "_manual_tab.txt";
            let header = `Manual Position Guitar Tab: ${songTitle}\nGenerated by Smart Adaptive Backend\n\n`;

            let details = "Sequence Details:\n";
            manualSequence.forEach((pos, i) => {
                const noteName = getNoteName(pos.string, pos.fret);
                const slide = pos.modifier === '/' ? ' (Slide)' : '';
                details += `[#${i + 1}] String ${pos.string}, Fret ${pos.fret} -> Note: ${noteName}${slide}\n`;
            });

            const fullText = header + tabText + "\n\n" + details;
            
            const blob = new Blob([fullText], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function newProject() {
            if (manualSequence.length > 0) {
                if (!confirm("Start an empty project? Any unsaved tab changes will be cleared.")) return;
            }
            document.getElementById('songTitle').value = "Untitled";
            document.getElementById('manualString').value = "1";
            document.getElementById('manualFret').value = "0";
            document.getElementById('isSlide').checked = false;
            
            manualSequence = [];
            renderList();
            document.getElementById('visual-tab').innerText = "No items added yet...";
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js');
            });
        }
    </script>
</body>

</html>
